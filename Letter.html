<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <script type="module" src="./js/letter.js"></script>
</head>

<body>
    <div class="letter-Box-Main">
        <div id="Letter-box" class="letter-box">
            <strong class="letter-display"><span id="letter-display"></span></strong>
        </div>
        <img src="images/arrow.png" class="arrow" />
        <div>
            <div id="Word-box" class="word-box">
                <div class="wordimage">
                    <img src="" alt="" id="word-image" class="wordimage">
                </div>
                <p class="Word-display"><span id="word-display"></span></p>

            </div>
            <div class="nav-buttons">
                <button class="nav-but" id="previousword">
                    <img width="30" height="30" src="https://img.icons8.com/ffffff/ios-filled/50/back.png" alt="back" />

                </button>
                <button class="nav-but" id="nextword">
                    <img width="30" height="30" src="https://img.icons8.com/ffffff/ios-filled/50/forward--v1.png"
                        alt="forward--v1" />

                </button>
            </div>
        </div>
</body>

</html>
