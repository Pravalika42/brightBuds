<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./js/read.js"></script>
</head>
<body>
    <div id="Sentence-box" class="sentence-box">
    </div>
    <dialog class="congrats-box">
        <h1>Congrats! You completed <span id="completed-letter"></span></h1>
        <div class="balloon-container">
            <div class="balloon" style="left: 10%; animation-delay: 0s;">🎈</div>
            <div class="balloon" style="left: 30%; animation-delay: 0.3s;">🎈</div>
            <div class="balloon" style="left: 50%; animation-delay: 0.6s;">🎈</div>
            <div class="balloon" style="left: 70%; animation-delay: 0.9s;">🎈</div>
            <div class="balloon" style="left: 90%; animation-delay: 1.2s;">🎈</div>
        </div>
        <button id="closeCongrats">Yay!</button>
    </dialog>
</body>

</html>
